{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "backstage.postgresql.fullname" . }}
  labels:
    {{- include "backstage.postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "backstage.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "backstage.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backstage.postgresql.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $pg.podSecurityContext | nindent 8 }}
      containers:
        - name: postgresql
          image: {{ printf "%s/%s:%s" $pg.image.registry $pg.image.repository $pg.image.tag | quote }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "backstage.postgresql.secretName" . }}
                  key: {{ $pg.auth.secretKey }}
            # Subdirectory so initdb does not trip over lost+found on the volume root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          securityContext:
            {{- toYaml $pg.securityContext | nindent 12 }}
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\""]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\""]
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\""]
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not $pg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "backstage.postgresql.selectorLabels" . | nindent 14 }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "backstage.postgresql.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
{{- end }}

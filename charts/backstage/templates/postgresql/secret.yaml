{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "backstage.postgresql.fullname" . }}
{{- $key := .Values.postgresql.auth.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing (index ($existing.data | default dict) $key) }}
{{- $password = index $existing.data $key }}
{{- else }}
{{- $password = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "backstage.postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $password | quote }}
{{- end }}
